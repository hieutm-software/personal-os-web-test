<dx-popup [width]="90 + '%'" [showTitle]="true" titleTemplate="title" [dragEnabled]="true"
    [closeOnOutsideClick]="false" [showCloseButton]="false" [(visible)]="popupVisible">
    <div *dxTemplate="let data of 'title'">
        <h3>Các đơn nghỉ phép chưa được phê duyệt
            <dx-button icon="close" (onClick)="popupVisible = false" style="position: absolute; right: 5px">
            </dx-button>
        </h3>
    </div>
    <dx-scroll-view id="scrollview" [scrollByContent]="true" [scrollByThumb]="true" showScrollbar="onScroll"
        [bounceEnabled]="false" reachBottomText="Updating...">
        <filter-leave-application #filterBox style="margin: 0 15px">
        </filter-leave-application>
        <dx-data-grid #dataGrid [dataSource]="dataSource" [width]="100 + '%'"  [height]="550 + 'px'" [remoteOperations]="true" keyExpr="id"
            [columnAutoWidth]="true" [wordWrapEnabled]="true" [focusedRowEnabled]="true" (onSelectionChanged)="selectionChanged($event)"
            (onToolbarPreparing)="onToolbarPreparing($event)" (onCellPrepared)="onCellPrepared($event)">
            <dxo-export [enabled]="true"></dxo-export>
            <dxo-sorting mode="none"></dxo-sorting>
            <dxo-paging [enabled]="true" [pageSize]="5" [pageIndex]="0"></dxo-paging>
            <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 15, 20, 30]" [showInfo]="true">
            </dxo-pager>
            <dxo-selection [selectAllMode]="allMode" [showCheckBoxesMode]="checkBoxesMode"
            mode="multiple"></dxo-selection>
            <dxi-column dataField="approvedDate" caption="{{ 'Ngày phê duyệt' | localize }}"
                [visible]="false"></dxi-column>
            <dxi-column dataField="censorId" caption="{{ 'Mã người phê duyệt' | localize }}"
                [visible]="false"></dxi-column>
            <dxi-column dataField="subscriberId" caption="{{ 'Mã người đăng ký' | localize }}"
                [visible]="false"></dxi-column>
            <dxi-column datafield="isHalfDayLeave" caption="{{ 'Nghỉ nửa ngày' | localize }}"
                [visible]="false"></dxi-column>
            <dxi-column datafield="applicationTypeId" caption="{{ 'LeaveApplicationTypeID' | localize }}"
                [visible]="false"></dxi-column>
            <dxi-column dataField="stt" caption="{{ 'STT' | localize }}" [visible]="true" alignment="center">
            </dxi-column>
            <dxi-column dataField="subcriberName" caption="{{ 'Người tạo đơn' | localize }}" [width]="15 + '%'"
                [allowSorting]="false" alignment="center">
            </dxi-column>
            <dxi-column dataField="departmentName" caption="{{ 'Đơn vị' | localize }}" [width]="8 + '%'"
                [allowSorting]="false" alignment="center">
            </dxi-column>
            <dxi-column dataField="creationTime" caption="{{ 'Ngày tạo' | localize }}" dataType="date"
                format="dd/MM/yyyy" [width]="10 + '%'" [allowSorting]="false" alignment="center">
            </dxi-column>
            <dxi-column dataField="fromDate" caption="{{ 'Từ ngày' | localize }}" dataType="date" format="dd/MM/yyyy"
                [width]="10 + '%'" [allowSorting]="true" alignment="center">
            </dxi-column>
            <dxi-column dataField="toDate" caption="{{ 'Đến ngày' | localize }}" dataType="date" format="dd/MM/yyyy"
                [width]="10 + '%'" [allowSorting]="true" alignment="center">
            </dxi-column>
            <dxi-column dataField="numberOfDayOff" caption="{{ 'Tổng số ngày nghỉ' | localize }}" [width]="8 + '%'"
                [allowSorting]="false" alignment="center">
            </dxi-column>
            <dxi-column dataField="registrationReason" caption="{{ 'Lý do xin nghỉ' | localize }}" [width]="15 + '%'"
                [allowSorting]="false" alignment="center">
            </dxi-column>
            <dxi-column dataField="leaveApplicationTypeTitle" caption="{{ 'Hình thức nghỉ' | localize }}"
                [width]="10 + '%'" [allowSorting]="false" alignment="center">
            </dxi-column>
            <dxi-column dataField="status" caption="{{ 'Trạng thái' | localize }}" [width]="10 + '%'"
                [allowSorting]="false" alignment="center">
            </dxi-column>
            <dxi-column cssClass="header-center" dataField="approvelNote" caption="{{ 'Lưu ý' | localize }}" [width]="10 + '%'"
                [allowSorting]="false" alignment="center">
            </dxi-column>
            <!-- <dxi-column type="buttons" caption="{{ 'Thao tác' | localize }}" [width]="10 + '%'">
                <dxi-button title="View" name="view" icon="fi flaticon-eye" [onClick]="onView"></dxi-button>
                <dxi-button title="Edit" name="edit" icon="edit" [onClick]="onEdit"></dxi-button>
                <dxi-button title="Delete" name="delete" icon="trash" [onClick]="onDelete"></dxi-button>
            </dxi-column> -->
        </dx-data-grid>
    </dx-scroll-view>
</dx-popup>
